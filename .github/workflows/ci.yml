name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate when called by the release workflow
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:package
  integration:
    name: Magpie 0.1.1219 / Bun 1.4.3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: npm ci --ignore-scripts
      - name: Download and verify pinned Magpie CLI
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/magpie" https://github.com/yetone/magpie/releases/download/v0.1.1219/magpie-cli-linux-amd64
          echo "d76af99bf0118e97ef2aa476ca604a0a4c0fbc4e12d42272620537a3015ab8ab  $RUNNER_TEMP/magpie" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/magpie"
      - name: Test real plugin host with fake upstream and temporary home
        run: npm run test:integration
        env:
          MAGPIE_BIN: ${{ runner.temp }}/magpie
